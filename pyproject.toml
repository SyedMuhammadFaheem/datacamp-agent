[project]
name = "dcai"
version = "0.1.0"
description = "Token-efficient, cache-first automation of DataCamp exercises via the Chrome DevTools Protocol"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["datacamp", "automation", "chrome-devtools-protocol", "cdp", "llm", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "websocket-client>=1.7",
]

[project.urls]
Homepage = "https://github.com/SyedMuhammadFaheem/datacamp-agent"
Issues = "https://github.com/SyedMuhammadFaheem/datacamp-agent/issues"
Changelog = "https://github.com/SyedMuhammadFaheem/datacamp-agent/blob/main/CHANGELOG.md"

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
dcai = "dcai.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcai"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

name: Bug report
description: Something isn't working as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please don't paste credentials, API keys, or full exercise text/solutions.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Command run and exercise type
      description: e.g. `dcai start <url>`; coding / MCQ / video; course slug is fine, no exercise text needed
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, Chrome version, LLM provider (`claude-code` / `claude-api`)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output with `-v` (redacted)
      render: shell
